# Pre-commit hooks — blocks commits that break strict TypeScript or lint rules
# Hooks operate on the React Native frontend under /app/mobile.
# Install: cd /app/mobile && npx lefthook install (or run from repo root)

pre-commit:
  parallel: true
  commands:
    typecheck:
      glob: "mobile/**/*.{ts,tsx}"
      root: "mobile/"
      run: npx tsc --noEmit
      stage_fixed: true
    lint:
      glob: "mobile/**/*.{ts,tsx}"
      root: "mobile/"
      run: npx eslint --max-warnings=0 {staged_files}
      stage_fixed: true
    no-duplicate-files:
      root: "mobile/"
      run: |
        # Fail if any duplicate exports are detected
        duplicates=$(grep -rh "^export function\|^export const\|^export default" src/ --include="*.tsx" --include="*.ts" | sort | uniq -d)
        if [ -n "$duplicates" ]; then
          echo "DUPLICATE EXPORTS DETECTED:"
          echo "$duplicates"
          exit 1
        fi

pre-push:
  commands:
    typecheck-full:
      root: "mobile/"
      run: npx tsc --noEmit
