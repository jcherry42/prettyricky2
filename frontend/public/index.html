<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supercharg'd - Automotive Sales Platform</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #05070A; color: #fff; font-family: -apple-system, system-ui, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { text-align: center; padding: 40px; }
    h1 { font-size: 2.5rem; letter-spacing: 6px; background: linear-gradient(135deg, #D6B25E, #C9A84C, #D6B25E); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 16px; }
    .subtitle { color: #999; font-size: 0.85rem; letter-spacing: 2px; margin-bottom: 40px; }
    .status { display: inline-block; padding: 12px 28px; border-radius: 14px; border: 1px solid rgba(214,178,94,0.25); background: rgba(214,178,94,0.06); color: #D6B25E; font-size: 0.8rem; font-weight: 700; letter-spacing: 1.5px; }
    .api-info { margin-top: 30px; color: #666; font-size: 0.7rem; letter-spacing: 1px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>SUPERCHARG'D</h1>
    <p class="subtitle">AUTOMOTIVE SALES PLATFORM</p>
    <div class="status">MOBILE APP — USE EXPO GO</div>
    <p class="api-info">API: /api/health</p>
  </div>
</body>
</html>
